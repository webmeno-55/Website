<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Webmeno Technology | WELCOME</title>
    <link rel="icon" href="assets/images/logo_half_dark_without_bg.webp" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@100..900&family=Ruluko&display=swap"
        rel="stylesheet">

    <!-- AOS cdn -->
    <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">


</head>

<body>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Raleway:400,700');

        *,
        *:before,
        *:after {
            box-sizing: border-box
        }

        .main {
            min-height: 100vh;
        }

        .container {
            position: absolute;
            width: 100%;
            height: 100%;
            overflow: hidden;

            &:hover,
            &:active {

                .top,
                .bottom {

                    &:before,
                    &:after {
                        margin-left: 200px;
                        transform-origin: -200px 50%;
                        transition-delay: 0s;
                    }
                }

                .center {
                    opacity: 1;
                    transition-delay: 0.2s;
                }
            }
        }

        .top,
        .bottom {

            &:before,
            &:after {
                content: '';
                display: block;
                position: absolute;
                width: 200vmax;
                height: 200vmax;
                top: 50%;
                left: 50%;
                margin-top: -100vmax;
                transform-origin: 0 50%;
                transition: all 0.5s cubic-bezier(0.445, 0.05, 0, 1);
                z-index: 10;
                opacity: 0.65;
                transition-delay: 0.2s;
            }
        }

        .top {
            &:before {
                transform: rotate(45deg);
                background: #e46569;
            }

            &:after {
                transform: rotate(135deg);
                background: #ecaf81;
            }
        }

        .bottom {
            &:before {
                transform: rotate(-45deg);
                background: #60b8d4;
            }

            &:after {
                transform: rotate(-135deg);
                background: #3745b5;
            }
        }

        .center {
            position: absolute;
            width: 400px;
            height: 400px;
            top: 50%;
            left: 50%;
            margin-left: -200px;
            margin-top: -200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.445, 0.05, 0, 1);
            transition-delay: 0s;
            color: #333;

            input {
                width: 100%;
                padding: 15px;
                margin: 5px;
                border-radius: 1px;
                border: 1px solid #ccc;
                font-family: inherit;
            }
        }
    </style>

    <style>stl sky
        .client_login_btn {
            display: flex;
            justify-content: center;
        }
        .client_login_btn button{
            border: 1px solid #523737;
            padding: .5rem 1rem;
            color: #523737;
            font-weight: bold;
        }
        .center h2{
            text-align: center;
        }
        .center input:focus{
            outline: none;
        }
    </style>

    

    <!-- Login Form -->
    <div class="main">
        <div class="container" onclick="onclick">
            <div class="top"></div>
            <div class="bottom"></div>
            <div class="center">
                <form action="">

                    <h2>Client Login</h2>
                    <input type="text" placeholder="User" />
                    <input type="password" placeholder="password" />
                    <div class="client_login_btn">
                        <button>Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Login Form End -->




    <script>
        // for nav scroll effect
        const navbar = document.querySelector('.navbar');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });
    </script>

    <!-- Back to top -->
    <div class="back_to_top" id="backToTop">
        <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <svg class="svgIcon" viewBox="0 0 384 512">
                <path
                    d="M214.6 41.4c-12.5-12.5-32.8-12.5-45.3 0l-160 160c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L160 141.2V448c0 17.7 14.3 32 32 32s32-14.3 32-32V141.2L329.4 246.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3l-160-160z">
                </path>
            </svg>
        </button>
    </div>
    <script>
        // for back to top
        const backToTop = document.getElementById('backToTop');
        const button = backToTop.querySelector('button');

        button.style.display = 'none';

        window.addEventListener('scroll', () => {
            if (window.scrollY > 200) {
                button.style.display = 'flex';
            } else {
                button.style.display = 'none';
            }
        });
    </script>
    <!-- Back to top End -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous">
        </script>

    <!-- AOS JS -->
    <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>

    <!-- AOS Initialization -->
    <script>
        AOS.init({
            offset: 120,        // offset (in px) from the original trigger point
            delay: 0,           // values from 0 to 3000, with step 50ms
            duration: 400,      // values from 0 to 3000, with step 50ms
            easing: 'ease',     // default easing for AOS animations
            once: false,        // whether animation should happen only once - while scrolling down
            mirror: false,      // whether elements should animate out while scrolling past them
            anchorPlacement: 'top-bottom' // defines which position of the element regarding to window should trigger the animation
        });
    </script>
</body>

</html>
